[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "memory-sdk"
version = "0.1.0"
description = "Async-native layered memory for LLM agents - typed facts/summaries/insights, temporal supersession, entity graph, LLM consolidation. SQLite, no vector DB."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ctqone" }]
keywords = ["llm", "agents", "memory", "agent-memory", "sqlite", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
local = ["sentence-transformers>=2.7"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyright>=1.1.380",
]

[project.urls]
Homepage = "https://github.com/ctqone/memory_sdk"
Repository = "https://github.com/ctqone/memory_sdk"
Issues = "https://github.com/ctqone/memory_sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
